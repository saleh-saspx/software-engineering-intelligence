schema_version: "1.1"
name: concurrency-durability-internals
expected_outcome: |
  An explanation grounded in database mechanisms for deadlocks, bloat and a proposed storage
  switch in a PostgreSQL 16 ledger. Transfers lock the two accounts in request order, so concurrent
  A→B and B→A transfers deadlock — lock in a consistent order (e.g. by id) and retry on deadlock or
  serialization failure. The three-hour REPEATABLE READ report keeps an old snapshot open, so
  vacuum cannot remove dead row versions and tables bloat — run it on a replica, in shorter
  transactions or from an export. synchronous_commit=off can lose the most recent commits on a crash
  (without corrupting the database), which a ledger usually cannot accept. Moving the ledger to an
  LSM-tree store trades read amplification and compaction for write throughput and does not remove
  the need for transactions or fix deadlocks. It asks for evidence (pg_locks, deadlock logs,
  pg_stat_activity, autovacuum statistics) and does not invent benchmarks.
context:
  scaffold_script: place-files.sh
